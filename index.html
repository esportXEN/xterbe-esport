<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <title>Xterbe Esport</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #05060a;
      color: #d6d6d6;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #000000, #007bff);
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }
    .hero h1 {
      font-size: 3rem;
      text-transform: uppercase;
      letter-spacing: 5px;
    }

    /* NAV */
    nav {
      background: #000;
      padding: 12px;
      text-align: center;
      position: sticky;
      top: 0;
    }
    nav a {
      color: #d6d6d6;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      color: #4da3ff;
    }

    /* SECTIONS */
    section {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    section h2 {
      color: #4da3ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    /* CARDS */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }
    .card {
      background: #0f0f17;
      border: 1px solid #007bff;
      border-radius: 10px;
      padding: 20px;
    }

      width: 100%;
      height: 150px;
      background: #1a1a1f;
